<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drop 01 | KINETIC</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/motion.css">

<body>
  
  <div class="noise-overlay"></div>

  <div class="page-transition">
    <div class="loader-text">DROP 01</div>
  </div>

  <nav class="navbar" style="mix-blend-mode: normal; color: var(--color-text-primary); border-bottom: 2px solid var(--color-border); background: var(--color-bg);">
    <div class="container">
      <a href="index.html" class="nav-brand">
        <h4 style="margin:0; font-size: 2rem;">KINETIC</h4>
      </a>
      <ul class="nav-links flex gap-8 items-center">
        <li><a href="drop.html" class="nav-link active">Drop 01</a></li>

      </ul>

  </nav>

  <main style="padding-top: var(--space-32);">
    
    <div class="marquee-container" style="background-color: var(--color-surface); color: var(--color-bg); margin-bottom: var(--space-8);">
      <div class="marquee-content" style="animation-direction: reverse;">
        LIMITED EDITION &middot; SOLD OUT SOON &middot; LIMITED EDITION &middot; SOLD OUT SOON &middot; LIMITED EDITION &middot; SOLD OUT SOON &middot;

    </div>

    <section class="section" style="padding-top: 0;">
      <div class="container">
        
        <div class="grid grid-cols-3 gap-8">
          
          <!-- Product 1 -->
          <div class="product-card hard-fade-up">
            <div class="product-card__image-wrapper">
              <img src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?q=80&w=1974&auto=format&fit=crop" alt="Sneaker" class="product-card__image">
            </div>
            <div class="product-card__info">
              <h4 class="product-card__title">KNTC High-Top V1</h4>
              <div class="product-card__price">$180</div>
            </div>
          </div>

          <!-- Product 2 -->
          <div class="product-card hard-fade-up delay-1">
            <div class="product-card__image-wrapper">
              <img src="https://images.unsplash.com/photo-1552346154-21d32810baa3?q=80&w=2070&auto=format&fit=crop" alt="Sneaker" class="product-card__image">
            </div>
            <div class="product-card__info">
              <h4 class="product-card__title">Blood Runner Zero</h4>
              <div class="product-card__price text-accent">$220</div>
            </div>
          </div>

          <!-- Product 3 -->
          <div class="product-card hard-fade-up delay-2">
            <div class="product-card__image-wrapper">
              <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=1974&auto=format&fit=crop" alt="Sneaker" class="product-card__image">
            </div>
            <div class="product-card__info">
              <h4 class="product-card__title">Concrete Low</h4>
              <div class="product-card__price">$150</div>
            </div>
          </div>

        </div>

      </div>
    </section>
  </main>

  <footer class="section bg-surface" style="padding-bottom: var(--space-8); margin-top: var(--space-16);">
    <div class="container flex justify-between items-center" style="border-top: 2px solid var(--color-bg); padding-top: var(--space-4);">
      <p style="margin: 0; color: var(--color-text-inverted);">&copy; 2026 KINETIC ATHLETICS.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
